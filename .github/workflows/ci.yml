name: CI

on:
  push:
    paths:
      - "gyのFW/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "gyのFW/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: gyのFW

jobs:
  typecheck-test-build:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gyのFW/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # #24/#45：依赖审计双报告，非阻断但写 job summary 可见——生产链 nanoid 已知
      # 待 Colyseus 0.18 大版本（#20/#24）；dev 侧修复后应保持无 high。
      - name: Audit (prod + dev, report to summary, non-blocking)
        run: |
          {
            echo "### npm audit"
            echo "**production**（nanoid 已知项，待 Colyseus 0.18，#20/#24）："
            npm audit --omit=dev --audit-level=high || true
            echo ""
            echo "**dev**（修复后应无 high）："
            npm audit --audit-level=high || true
          } >> "$GITHUB_STEP_SUMMARY"

  coverage:
    # #39：覆盖率阈值门禁接入 CI（此前仅手工跑，属"自觉门禁"）。CI 环境下
    # vitest thresholds.autoUpdate 关闭（见 vitest.config.ts）——阈值只读，
    # ratchet 仍由本地 test:coverage 抬升后人工提交。
    name: coverage thresholds (v8, read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gyのFW/package-lock.json
      - name: Install
        run: npm ci
      - name: Test with coverage thresholds
        run: npm run test:coverage

  determinism:
    name: determinism (forest r0-baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gyのFW/package-lock.json
      - name: Install
        run: npm ci
      - name: Compare forest 48-level determinism against r0-baseline
        run: node --import tsx benchmark/perf-determinism.mjs --compare r0-baseline --filter forest

  determinism-ice:
    name: determinism (ice r2-tpgate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gyのFW/package-lock.json
      - name: Install
        run: npm ci
      - name: Compare ice 51-level determinism against r2-tpgate
        run: node --import tsx benchmark/perf-determinism.mjs --compare r2-tpgate --filter ice

  determinism-light:
    name: determinism (light r0-light)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gyのFW/package-lock.json
      - name: Install
        run: npm ci
      - name: Compare light 40-level determinism against r0-light
        run: node --import tsx benchmark/perf-determinism.mjs --compare r0-light --filter light

  routes-smoke:
    name: routes smoke (route-node real-server sample)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gyのFW/package-lock.json
      - name: Install
        run: npm ci
      # 正式门禁仍为本地 repeat>=3（见 AGENTS.md）；CI 只做回归冒烟。
      # light_01 不入样本：±1f 刀锋时序对调度抖动敏感（本地约 1/5 假阴），避免 CI 常红。
      - name: route-node forest_01
        run: node --import tsx scripts/e2e/route-node.mjs --level forest_01 --repeat 1
      - name: route-node light_02
        run: node --import tsx scripts/e2e/route-node.mjs --level light_02 --repeat 1 --offset -10

  browser-room:
    # 2026-10-28 P0 回归门禁：浏览器真实建房链路冒烟——seedrandom 的 new Function 被
    # CSP（0.3.51 #45）禁 eval 拦截后，建房→Game 全断潜伏 0.3.51–0.3.55 五个版本，
    # node 侧 e2e（route-node/servers-smoke）不加载浏览器 bundle、audiofamily 不建房，
    # 均罩不住本链路。断言：建房→Game create 完成（pageerror=0，new Function 类回归
    # 会当场炸 create）→ groundTex 在场 → 离房回选关后释放（r13）。
    name: browser-room (create→Game→leave)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gyのFW/package-lock.json
      - name: Install
        run: npm ci
      - name: Install chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Server + browser-room
        run: |
          node --import tsx packages/server/src/index.ts &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:2567/healthz >/dev/null && break; sleep 1; done
          node scripts/e2e/browser-room.mjs --base http://127.0.0.1:2567

  servers-smoke:
    # #37：干净 checkout 冒烟——无 TEMP/ 目录起服 + /healthz 探活，专抓
    # pidfile/日志/落盘目录这类环境假设（单元测试罩不住的脚本级问题）。
    name: servers smoke (clean checkout servers.sh + healthz)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gyのFW/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Start play server via servers.sh
        run: scripts/dev/servers.sh start play
      - name: Probe /healthz
        run: |
          code=""
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 2 http://127.0.0.1:3700/healthz || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ] || { echo "/healthz 未就绪（最后状态 $code）"; exit 1; }
          echo "/healthz 200"
      - name: Stop
        if: always()
        run: scripts/dev/servers.sh stop play

  repo-size:
    # #42：仓库 tracked 体积软阈值——超限只写 summary 告警不阻断，防大文件静默回涨。
    name: repo size (soft threshold)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Report tracked size
        run: |
          BYTES=$(git ls-tree -r -l HEAD | awk '{s+=$4} END {print s+0}')
          MIB=$((BYTES / 1048576))
          echo "tracked = ${MIB} MiB" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$MIB" -gt 150 ]; then
            echo "⚠️ tracked 体积 ${MIB} MiB 超软阈值 150 MiB（#42）——请检查是否新增大文件（golden/基准快照/素材）" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

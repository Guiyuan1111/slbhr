name: CI

on:
  push:
    paths:
      - "gyのFW/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "gyのFW/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: gyのFW

jobs:
  typecheck-test-build:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gyのFW/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  determinism:
    name: determinism (r0-baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gyのFW/package-lock.json
      - name: Install
        run: npm ci
      - name: Compare 48-level determinism against r0-baseline
        run: node --import tsx benchmark/perf-determinism.mjs --compare r0-baseline

name: CI

on:
  push:
    paths:
      - "gyのFW/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "gyのFW/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: gyのFW

jobs:
  typecheck-test-build:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gyのFW/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # #24：生产依赖高危审计，非阻断（先报告观察；Colyseus 链 nanoid 已知待大版本，见 issue #20/#24）
      - name: Audit (production deps, non-blocking)
        run: npm audit --omit=dev --audit-level=high || true

  determinism:
    name: determinism (forest r0-baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gyのFW/package-lock.json
      - name: Install
        run: npm ci
      - name: Compare forest 48-level determinism against r0-baseline
        run: node --import tsx benchmark/perf-determinism.mjs --compare r0-baseline --filter forest

  determinism-ice:
    name: determinism (ice r1-ice)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gyのFW/package-lock.json
      - name: Install
        run: npm ci
      - name: Compare ice 51-level determinism against r1-ice
        run: node --import tsx benchmark/perf-determinism.mjs --compare r1-ice --filter ice

  determinism-light:
    name: determinism (light r0-light)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gyのFW/package-lock.json
      - name: Install
        run: npm ci
      - name: Compare light 40-level determinism against r0-light
        run: node --import tsx benchmark/perf-determinism.mjs --compare r0-light --filter light

  routes-smoke:
    name: routes smoke (route-node real-server sample)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gyのFW/package-lock.json
      - name: Install
        run: npm ci
      # 正式门禁仍为本地 repeat>=3（见 AGENTS.md）；CI 只做回归冒烟。
      # light_01 不入样本：±1f 刀锋时序对调度抖动敏感（本地约 1/5 假阴），避免 CI 常红。
      - name: route-node forest_01
        run: node --import tsx scripts/e2e/route-node.mjs --level forest_01 --repeat 1
      - name: route-node light_02
        run: node --import tsx scripts/e2e/route-node.mjs --level light_02 --repeat 1 --offset -10

  servers-smoke:
    # #37：干净 checkout 冒烟——无 TEMP/ 目录起服 + /healthz 探活，专抓
    # pidfile/日志/落盘目录这类环境假设（单元测试罩不住的脚本级问题）。
    name: servers smoke (clean checkout servers.sh + healthz)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gyのFW/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Start play server via servers.sh
        run: scripts/dev/servers.sh start play
      - name: Probe /healthz
        run: |
          code=""
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 2 http://127.0.0.1:3700/healthz || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ] || { echo "/healthz 未就绪（最后状态 $code）"; exit 1; }
          echo "/healthz 200"
      - name: Stop
        if: always()
        run: scripts/dev/servers.sh stop play

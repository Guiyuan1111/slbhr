name: CI

on:
  push:
    paths:
      - "gyのFW/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "gyのFW/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: gyのFW

jobs:
  typecheck-test-build:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gyのFW/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  determinism:
    name: determinism (forest r0-baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gyのFW/package-lock.json
      - name: Install
        run: npm ci
      - name: Compare forest 48-level determinism against r0-baseline
        run: node --import tsx benchmark/perf-determinism.mjs --compare r0-baseline --filter forest

  determinism-ice:
    name: determinism (ice r0-ice)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gyのFW/package-lock.json
      - name: Install
        run: npm ci
      - name: Compare ice 51-level determinism against r0-ice
        run: node --import tsx benchmark/perf-determinism.mjs --compare r0-ice --filter ice

  determinism-light:
    name: determinism (light r0-light)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gyのFW/package-lock.json
      - name: Install
        run: npm ci
      - name: Compare light 40-level determinism against r0-light
        run: node --import tsx benchmark/perf-determinism.mjs --compare r0-light --filter light

# 1.0 分发链：从 tag 源码构建部署包并上传到同名 Release。
# 背景：本机网络对 uploads.github.com 选择性阻断（api/github.com 正常、上传握手必败），
# 附件改由 CI 侧构建上传；分发产物由此永远等于 tag 源码的确定性产出。
# 触发：推送 1.0.* tag；或 workflow_dispatch（--ref release/1.0-forest，main 无打包链）。
name: release-asset

on:
  push:
    tags:
      - "1.0.*"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: gyのFW

jobs:
  package-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gyのFW/package-lock.json
      - name: Guard（只认 1.0.* tag 名；分支手动派发会误建同名 release）
        run: |
          case "$GITHUB_REF_NAME" in
            1.0.*) : ;;
            *) echo "GITHUB_REF_NAME=$GITHUB_REF_NAME 非 1.0.*——tag push 才是正确触发方式"; exit 1 ;;
          esac
          test -f scripts/package-deploy.mjs || { echo "本 ref 无打包链（package-deploy.mjs）"; exit 1; }
      - name: Install
        run: npm ci
      - name: Install chromium（真开局冒烟要开浏览器）
        run: npx playwright install --with-deps chromium
      - name: Build client
        run: npm run build
      - name: Package（内含生产依赖预装 + 产物真开局冒烟）
        # #51 防回归：package-deploy 内置 deploy-smoke——起服→双人开局→assert patch
        # 持续→assert 进程存活→浏览器建房进 Game。六步验收的 ⑥ 只 create→leave，
        # 状态从未广播增量，「能起服不能开局」在验收里完全隐形（1.0.0 就这样漏出去）。
        run: node scripts/package-deploy.mjs
      - name: 解包复验（独立 tmp 目录，模拟真实部署）
        run: |
          tmp="$(mktemp -d)"
          tar -xzf TEMP/gy-fw-forest-*.tar.gz -C "$tmp"
          pkg="$(find "$tmp" -maxdepth 1 -name 'gy-fw-forest-*' -type d)"
          echo "包目录: $pkg"
          # 包里不得残留 TS 源码或测试（1.0.1 起预转译，跑 .js）
          test -z "$(find "$pkg" -path '*/node_modules' -prune -o -name '*.ts' -print)"
          test -z "$(find "$pkg" -path '*/node_modules' -prune -o -name '__tests__' -type d -print)"
          node scripts/e2e/deploy-smoke.mjs --serve-dir "$pkg" --port 2599 --window 8000
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "部署手册见包内 DEPLOY.md"
          gh release upload "$tag" TEMP/gy-fw-forest-*.tar.gz TEMP/gy-fw-forest-*.tar.gz.sha256 --repo "$GITHUB_REPOSITORY" --clobber
